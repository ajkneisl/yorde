name: Deploy YordE

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: yorde
  ECS_CLUSTER: yorde
  ECS_SERVICE: yorde
  CONTAINER_NAME: yorde

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    environment: production
    steps:
      -   name: Checkout
          uses: actions/checkout@v4

      -   name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: arn:aws:iam::445567081553:role/yordeDeployRole
            aws-region: ${{ env.AWS_REGION }}

      -   name: Login to ECR
          id: ecr
          uses: aws-actions/amazon-ecr-login@v2

      -   name: Build and push image
          id: build
          env:
            IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          run: |
            docker build -t "$IMAGE" .
            docker push "$IMAGE"
            echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      -   name: Render task definition
          id: taskdef
          run: |
            aws ecs describe-task-definition --task-definition yorde \
              --query taskDefinition > task-definition.json

      -   name: Update task definition image
          id: render
          uses: aws-actions/amazon-ecs-render-task-definition@v1
          with:
            task-definition: task-definition.json
            container-name: ${{ env.CONTAINER_NAME }}
            image: ${{ steps.build.outputs.image }}

      -   name: Deploy to ECS
          uses: aws-actions/amazon-ecs-deploy-task-definition@v2
          with:
            task-definition: ${{ steps.render.outputs.task-definition }}
            cluster: ${{ env.ECS_CLUSTER }}
            service: ${{ env.ECS_SERVICE }}
            wait-for-service-stability: true
